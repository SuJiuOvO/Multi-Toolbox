<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="512" height="512">
  <defs>
    <!-- 背景渐变：赋予底板微弱的光泽感 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0f4f8" />
    </linearGradient>

    <!-- 主视觉渐变：左上角的亮蓝色 -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#006AFF" />
    </linearGradient>

    <!-- 辅助色渐变：其余的浅蓝色模块 -->
    <linearGradient id="lightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8CE0FF" />
      <stop offset="100%" stop-color="#54B4EB" />
    </linearGradient>

    <!-- 悬浮阴影滤镜：保留之前扩大的范围和柔和参数 -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-opacity="0.08" flood-color="#002244" />
    </filter>
  </defs>

  <!-- ================= 修改重点 ================= -->
  <!-- 移除了 filter="url(#shadow)"，使最外层轮廓干净利落，不再向外扩散阴影 -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bgGrad)" />
  <!-- 保留细微的内边框，用于勾勒最外层清晰的轮廓 -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="none" stroke="#e4e9f2" stroke-width="1" />
  <!-- ============================================== -->

  <!-- 左上模块：深蓝色菱形 (中心点：38, 38) -->
  <g filter="url(#shadow)">
    <rect x="22" y="22" width="32" height="32" rx="8" fill="url(#blueGrad)" transform="rotate(45 38 38)" />
  </g>

  <!-- 左下模块：大号浅蓝色正方形 -->
  <rect x="16" y="68" width="44" height="44" rx="12" fill="url(#lightGrad)" filter="url(#shadow)" />

  <!-- 右下模块：大号浅蓝色正方形 -->
  <rect x="68" y="68" width="44" height="44" rx="12" fill="url(#lightGrad)" filter="url(#shadow)" />

  <!-- 右上模块：小号浅蓝色正方形 -->
  <rect x="76" y="24" width="28" height="28" rx="8" fill="url(#lightGrad)" filter="url(#shadow)" />
</svg>